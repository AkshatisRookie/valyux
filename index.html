<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valyux | Compare Prices, Save Money</title>
  <link rel="icon" type="image/png" href="./assets/valyux-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-body: 'DM Sans', system-ui, sans-serif;
      --bg-app: #f5f5f5;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-muted: #737373;
      --accent: #ea8108;
      --accent-hover: #ea8108;
    }
    html.dark {
      --bg-app: #171717;
      --bg-card: #262626;
      --text-primary: #fafafa;
      --text-muted: #a3a3a3;
      --accent: #ea8108;
      --accent-hover:  #ea8108;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <!-- Prevent flash of wrong theme (default to dark) -->
  <script>
    (function() {
      var saved = localStorage.getItem('valyux-theme');
      // Default to dark when no preference is stored.
      if (!saved || saved === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
